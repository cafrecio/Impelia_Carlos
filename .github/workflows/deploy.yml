name: Deploy sitio_web a Ferozo por FTP

on:
  push:
    branches: [main]
    paths:
      - 'sitio_web/**'
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sitio_web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: sitio_web

      - name: Build
        run: npm run build
        working-directory: sitio_web

      - name: Deploy por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: sitio_web/dist/
          server-dir: /
          dangerous-clean-slate: false
