name: Deploy sitio_web a Ferozo por FTP

on:
  push:
    branches: [main]
    paths:
      - 'sitio_web/**'
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sitio_web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: sitio_web

      - name: Build
        run: npm run build
        working-directory: sitio_web

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_SERVER';
            mirror -R --verbose sitio_web/dist/ /public_html/;
            quit
          "
