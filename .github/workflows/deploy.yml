name: Deploy sitio_web

on:
  push:
    branches: [main]
    paths:
      - 'sitio_web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sitio_web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: sitio_web

      - name: Build
        run: npm run build
        working-directory: sitio_web

      # --- DEPLOY TO FEROZO (FTP) ---
      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy por FTPS (Ferozo)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_SERVER';
            mirror -R --verbose sitio_web/dist/ /;
            quit
          "

      # --- DEPLOY TO GITHUB PAGES ---
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio_web/dist

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
