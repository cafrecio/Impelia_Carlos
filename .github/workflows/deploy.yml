name: Deploy sitio_web a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sitio_web/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sitio_web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: sitio_web

      - name: Build
        run: npm run build
        working-directory: sitio_web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio_web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
